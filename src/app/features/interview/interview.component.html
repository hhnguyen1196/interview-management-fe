<p-toolbar styleClass="mb-2">
  <ng-template #start>
    <p-button class="ml-4" label="Tạo công việc" icon="pi pi-plus" severity="secondary"
              (onClick)="openCreateInterview()"/>
  </ng-template>
</p-toolbar>


<p-table
  #dt
  [value]="interviews()"
  [rows]="size()"
  [paginator]="true"
  [rowHover]="true"
  dataKey="id"
  [totalRecords]="totalRecords()"
  currentPageReportTemplate="Tổng số {totalRecords} bản ghi"
  [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20]"
  [lazy]="true"
  (onLazyLoad)="onPageChange($event)"
>
  <ng-template #caption>
    <div class="flex items-center justify-between mx-3">
      <h5 class="font-semibold text-gray-900 text-3xl uppercase">Danh sách lịch phỏng vấn</h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search"/>
        <input pInputText type="text" name="search" [value]="search()" (keyup.enter)="onSearch($event)"
               class="w-96" placeholder="Search..."/>
      </p-iconfield>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th style="min-width: 16rem">Tiêu đề</th>
      <th style="min-width: 12rem">Tên ứng viên</th>
      <th style="min-width: 12rem">Người phỏng vấn</th>
      <th style="min-width: 14rem">Thời gian phỏng vấn</th>
      <th style="min-width: 10rem">Kết quả</th>
      <th style="min-width: 10rem">Trạng thái</th>
      <th style="min-width: 10rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-interview>
    <tr>
      <td>{{ interview.title }}</td>
      <td>{{ interview.candidateName }}</td>
      <td>{{ interview.interviewNames.join(', ') }}</td>
      <td>{{ interview.schedule }}</td>
      <td>{{ interview.result }}</td>
      <td>{{ interview.status }}</td>
      <!--      <td>-->
      <!--        &lt;!&ndash;        <p-tag [value]="statusMap[candidate.status]" [severity]="getStatusSeverity(candidate.status)"/>&ndash;&gt;-->
      <!--      </td>-->
      <td>
        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                  (click)="editInterview(interview.id)"/>
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                  (click)="deleteCandidate(interview.id)"/>
      </td>
    </tr>
  </ng-template>
</p-table>
