<button type="button"
        pButton
        class="p-button-text p-button-plain flex items-center gap-6 !p-0 mb-3"
        (click)="menu.toggle($event)">
  <p-avatar [label]="shortName()"
            shape="circle" styleClass="!w-11 !h-11 text-lg font-bold p-0 !bg-blue-200"
            class="flex items-center justify-center"/>

  <span class="font-bold">{{ accountPanel().username }}</span>
</button>

<p-menu #menu [model]="menuItems" [popup]="true"></p-menu>
