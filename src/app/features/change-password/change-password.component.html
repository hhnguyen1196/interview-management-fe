<div class="flex justify-center">
  <p-dialog header="Thay đổi mật khẩu" [modal]="true" [(visible)]="visible" [style]="{ width: '40rem' }"
            contentStyleClass="change-password-dialog"
            (onHide)="hideDialog()">
    <span class="p-text-secondary block mb-6">Nhập thông tin để đổi mật khẩu.</span>
    <div class="flex items-center gap-4 mb-4">
      <label for="username" class="font-semibold w-36">Mật khẩu cũ</label>
      <input pInputText id="username" class="flex-auto" autocomplete="off"/>
    </div>
    <div class="flex items-center gap-4 mb-4">
      <label for="email" class="font-semibold w-36">Mật khẩu mới</label>
      <input pInputText id="email" class="flex-auto" autocomplete="off"/>
    </div>
    <div class="flex items-center gap-4 mb-8">
      <label for="email" class="font-semibold w-36">Xác nhận mật khẩu</label>
      <input pInputText id="email" class="flex-auto" autocomplete="off"/>
    </div>
    <div class="flex justify-end gap-2">
      <p-button label="Đóng" severity="secondary" (click)="hideDialog()"/>
      <p-button label="Lưu" (click)="hideDialog()"/>
    </div>
  </p-dialog>
</div>
