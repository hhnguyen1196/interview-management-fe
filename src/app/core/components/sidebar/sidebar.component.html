<aside
  class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0"
  aria-label="Sidebar">

  <div class="h-full flex flex-col justify-between px-3 py-4 overflow-y-auto bg-gray-100">
    <ul class="space-y-2 font-medium">
      @for (item of menuItem; track $index) {
        <li>
          <app-menu-item [item]="item"></app-menu-item>
        </li>
      }
    </ul>
    <div>
      <app-account-panel/>
    </div>

  </div>
</aside>
